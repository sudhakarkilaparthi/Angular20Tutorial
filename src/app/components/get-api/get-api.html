<div class="row">
    <div class="col-4">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                @for (user of userList; track $index) {
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
<div class="col-4">
    <ul>
        @for (item of todoList; track $index) {
        <li>{{item.title}}</li>
        }
    </ul>
</div>
<div class="col-4">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            @for (user of bookingUserList; track $index) {
            <tr>
                <td>{{ user.userId }}</td>
                <td>{{ user.userName }}</td>
                <td>{{ user.emailId }}</td>
            </tr>
            }
        </tbody>
    </table>
</div>
